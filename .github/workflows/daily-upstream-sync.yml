name: Daily Upstream Sync

on:
  schedule:
    - cron: "0 7 * * *"  # 07:00 UTC
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 100

      - name: Add upstream remote and fetch
        run: |
          git remote add wizden https://github.com/space-wizards/space-station-14.git
          git fetch wizden master --depth=100

      - name: Configure git identity
        run: |
          git config user.name "Trieste-Port-Bot"
          git config user.email "331131394+Trieste-Port-Bot@users.noreply.github.com"

      - name: Create sync branch
        run: |
          BRANCH="sync/upstream-$(date +%Y-%m-%d)"
          echo "BRANCH=$BRANCH" >> $GITHUB_ENV
          git checkout -b "$BRANCH" wizden/master

      - name: Push sync branch
        run: |
          git push origin "$BRANCH" --force

      - name: Create Pull Request
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.BOT_TOKEN }}
          script: |
            await github.rest.pulls.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `Daily Upstream Sync (${process.env.BRANCH})`,
              head: process.env.BRANCH,
              base: "master",
              body: "Automated daily sync of space-wizards/space-station-14 master into our master."
            });
