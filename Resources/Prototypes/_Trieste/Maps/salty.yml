# TEST MAP PLEASE IGNORE
- type: gameMap
  id: TPGameMapSalty
  mapName: 'Salty Station'
  mapPath: /Maps/_Trieste/salty.yml
  minPlayers: 0
  maxPlayers: 35
  fallback: true
  stations:
    Saltern:
      stationProto: StandardNanotrasenStation
      components:
        - type: MultiMapManager
          maps:
            Boxy Station: TPGameMapBoxy
        - type: StationNameSetup
          mapNameTemplate: '{0} Salty Station {1}'
          nameGenerator:
            !type:NanotrasenNameGenerator
            prefixCreator: '14'
        - type: StationJobs
          availableJobs:
            # TOTAL: 57 job slots + 3 late-join only
            # Command (7)
            Captain: [ 1, 1 ]
            HeadOfPersonnel: [ 1, 1 ]
            HeadOfSecurity: [ 1, 1 ]
            ChiefMedicalOfficer: [ 1, 1 ]
            ChiefEngineer: [ 1, 1 ]
            ResearchDirector: [ 1, 1 ]
            Quartermaster: [ 1, 1 ]
            # Service (8 - 9)
            Bartender: [ 1, 1 ]
            Botanist: [ 1, 2 ]
            Chef: [ 1, 1 ]
            Janitor: [ 1, 1 ]
            Chaplain: [ 1, 1 ]
            Librarian: [ 1, 1 ]
            ServiceWorker: [ 2, 2 ]
            # Engineering (8)
            AtmosphericTechnician: [ 2, 2 ]
            StationEngineer: [ 4, 4 ]
            TechnicalAssistant: [ 4, 4 ]
            # Medical (10)
            Chemist: [ 2, 2 ]
            MedicalDoctor: [ 3, 3 ]
            MedicalIntern: [ 4, 4 ]
            Paramedic: [ 1, 1 ]
            # Science (6)
            Scientist: [ 4, 4 ]
            ResearchAssistant: [ 2, 2 ]
            # Security (10)
            Warden: [ 1, 1 ]
            Detective: [ 1, 1 ]
            SecurityOfficer: [ 4, 4 ]
            SecurityCadet: [ 4, 4 ]
            # Supply (3-5)
            SalvageSpecialist: [ 1, 3 ]
            CargoTechnician: [ 2, 2 ]
            # Civilian (3 + overflow)
            Passenger: [ -1, -1 ] # infinite, not counted
            Clown: [ 1, 1 ]
            Mime: [ 1, 1 ]
            Musician: [ 1, 1 ]
            # Silicon (2)
            Borg: [ 2, 2 ]
