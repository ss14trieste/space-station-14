- type: entity
  abstract: true
  parent: BaseStructure
  id: TP14BaseStructureBellComputer
  components:
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeAabb
          bounds: "-0.25,-0.35,0.25,0.35"
        density: 190
        mask:
        - MachineMask
        layer:
        - MachineLayer
  - type: InteractionOutline
  - type: Rotatable
  - type: Anchorable
    flags:
    - Anchorable # Disables unanchoring
  - type: Sprite
    drawdepth: Objects

- type: entity
  parent: TP14BaseStructureBellComputer
  id: TPComputerDivingBell
  name: diving bell console
  description: Used to send or request the diving bell.
  components:
  - type: Sprite
    sprite: Structures/Machines/computers.rsi
    layers:
    - map: ["computerLayerBody"]
      state: computer
    - map: ["computerLayerKeyboard"]
      state: generic_keyboard
    - map: ["computerLayerScreen"]
      state: shuttle
    - map: ["computerLayerKeys"]
      state: generic_keys
    - map: [ "enum.WiresVisualLayers.MaintenancePanel" ]
      state: generic_panel_open
  - type: Appearance
  - type: GenericVisualizer
    visuals:
      enum.ComputerVisuals.Powered:
        computerLayerScreen:
          True: { visible: true, shader: unshaded }
          False: { visible: false }
        computerLayerKeys:
          True: { visible: true, shader: unshaded }
          False: { visible: true, shader: shaded }
  - type: LitOnPowered
  - type: PointLight
    radius: 1.5
    energy: 4.0
    enabled: false
    lightMask: ConeSingle
    autoRot: true
    offset: "0, 0.4" # shine from the top, not bottom of the computer
    color: "#43ccb5"
    castShadows: false
  - type: EmitSoundOnUIOpen
    sound:
      collection: Keyboard
      params:
        volume: -1
        variation: 0.10
        pitch: 1.10  # low pitch keyboard sounds feel kinda weird
    blacklist:
      tags:
      - NoConsoleSound
  - type: Electrified
    enabled: false
    usesApcPower: true
  - type: RequireProjectileTarget
  - type: ActivatableUI
    key: enum.BellConsoleUiKey.Key
  - type: UserInterface
    interfaces:
      enum.BellConsoleUiKey.Key:
        type: BellConsoleBoundUserInterface
      enum.WiresUiKey.Key:
        type: WiresBoundUserInterface
  - type: BellConsole
    bellType: DivingBell
